[project]
name = "safe-fix"
version = "0.1.0"
description = "Safe bulk fixes in PostgreSQL: locked scope, count gates, durable backup, generated rollback SQL, audited transaction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
safe-fix = "safe_fix.fix:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_fix"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
