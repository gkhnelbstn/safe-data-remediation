name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: app
      PGPASSWORD: ci-only-password
      PGDATABASE: app
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Tests
        run: uv run pytest -v

      # The README walkthrough, step by step, at full size.
      - name: Walkthrough
        run: |
          uv run safe-fix demo --rows 2000000
          before=$(uv run safe-fix checksum public.shipments)
          uv run safe-fix apply examples/shipment-weights-in-grams.toml --dry-run
          test "$(uv run safe-fix checksum public.shipments)" = "$before"
          uv run safe-fix apply examples/shipment-weights-in-grams.toml
          test "$(uv run safe-fix checksum public.shipments)" != "$before"
          uv run safe-fix rollback "$(ls -d runs/*Z | tail -1)"
          test "$(uv run safe-fix checksum public.shipments)" = "$before"
          psql -c "select id, status, rows_locked, rows_changed from remediation.audit_log order by id"
